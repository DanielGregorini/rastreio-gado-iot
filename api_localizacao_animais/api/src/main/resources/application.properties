# ===============================================
# 🐇 CONFIGURAÇÃO DO RABBITMQ
# ===============================================

# ❌ ERRADO para Docker: 'localhost' aponta para o próprio container Java
# spring.rabbitmq.host=localhost

# ✅ CORRETO: usar o nome do serviço RabbitMQ do docker-compose
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Nome da fila que será consumida
rabbitmq.queue=user-created

# Nome da exchange usada para rotear mensagens
rabbitmq.exchange=user.exchange

# Routing key usada para direcionar mensagens
rabbitmq.routing-key=user-created
